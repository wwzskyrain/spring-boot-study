# ==================== XXL-JOB 调度中心配置 ====================
# 调度中心部署根地址（3.x 版部署在根路径，无 /xxl-job-admin 前缀，已实测）
xxl.job.admin.addresses=http://localhost:8080
# 调度中心管理后台登录账号（用于调用 /auth/doLogin 自动注册任务）
xxl.job.admin.login-username=admin
xxl.job.admin.login-password=123456

# 调度中心与执行器通信的 accessToken（3.x 必填，需与调度中心执行器配置一致）
xxl.job.access-token=default_token

# ==================== XXL-JOB 执行器配置 ====================
# 执行器 AppName（启动时会自动在调度中心创建同名执行器，并写入同样的 accessToken）
xxl.job.executor.appname=xxl-job-executor-study
# 执行器注册地址 IP（本机多网卡/虚拟网卡会导致自动检测到异常 IP(如198.18.0.1)导致调度派发失败，固定为 127.0.0.1 最稳妥）
xxl.job.executor.ip=127.0.0.1
# 执行器端口（调度中心通过该端口回调执行器执行任务）
xxl.job.executor.port=9999
# 执行器日志存放路径（macOS 上 /data 只读，改为用户目录下可写路径）
xxl.job.executor.log-path=${user.home}/logs/xxl-job/jobhandler
# 执行器日志保留天数
xxl.job.executor.log-retention-days=30
